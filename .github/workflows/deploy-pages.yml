name: Deploy client to GitHub Pages

on:
  workflow_run:
    workflows: [Verify]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Confirm the fully verified commit is still main
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current" = "$VERIFIED_SHA"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - name: Build client
        run: pnpm --filter @emberfall/client build
        env:
          BASE_API: ${{ vars.BASE_API || '176.36.232.74' }}
          BASE_PORT: ${{ vars.BASE_PORT || '4003' }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Confirm main still matches the fully verified release
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current" = "$VERIFIED_SHA"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
