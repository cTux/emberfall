name: Verify

on:
  pull_request:
  workflow_dispatch:
    inputs:
      desktop_game_checks:
        description: Run desktop game checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @emberfall/core test
      - run: pnpm test
      - run: pnpm build
      - name: Select affected desktop browser scenarios
        id: browsers
        run: node scripts/ci-browser-tests.ts select > "$RUNNER_TEMP/browser-selection.json"
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.browsers.outputs.ui == 'true' || (github.event_name == 'workflow_dispatch' && inputs.desktop_game_checks)
      - name: Create disposable browser-test certificate
        if: github.event_name == 'workflow_dispatch' && inputs.desktop_game_checks
        run: |
          mkdir -p .certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout .certs/localhost-key.pem -out .certs/localhost.pem \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      - name: Verify affected desktop game behavior
        if: github.event_name == 'workflow_dispatch' && inputs.desktop_game_checks
        run: node scripts/ci-browser-tests.ts game "$RUNNER_TEMP/browser-selection.json"
      - name: Verify desktop shared UI behavior
        if: steps.browsers.outputs.ui == 'true'
        run: >-
          pnpm --filter @emberfall/ui test --max-failures=1 --grep
          'HUD actions|inventory slots stay fixed|performance diagnostics|equipment slots accept inventory drops|backpack passes modifier keys|inventory dragging moves|storage supports forty slots|dialog closes with Escape|tabs, settings and voting|meters expose clamped|performance and volume labels|connection states use colored|compact consumable tooltip|incompatible gear explains|item tooltips show quantity|repeated stat labels|unequipped gear shows'
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            test-results/
            playwright-report/
            packages/ui/test-results/
            packages/ui/playwright-report/
          if-no-files-found: ignore
