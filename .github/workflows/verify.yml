name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @emberfall/core test
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Create disposable browser-test certificate
        run: |
          mkdir -p .certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout .certs/localhost-key.pem -out .certs/localhost.pem \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      - run: pnpm test:browser
      - run: pnpm --filter @emberfall/ui test
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            test-results/
            playwright-report/
            packages/ui/test-results/
            packages/ui/playwright-report/
          if-no-files-found: ignore
