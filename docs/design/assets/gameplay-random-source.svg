<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" role="img" aria-labelledby="title desc">
  <title id="title">Gameplay random source architecture</title>
  <desc id="desc">Web Crypto feeds random-js and the shared gameplay random source. Tests can inject a deterministic source. Configured chances remain unchanged.</desc>
  <rect width="840" height="240" rx="16" fill="#13202b"/>
  <g fill="#21394b" stroke="#68cfb2" stroke-width="2">
    <rect x="20" y="30" width="170" height="75" rx="10"/>
    <rect x="240" y="30" width="230" height="75" rx="10"/>
    <rect x="520" y="30" width="300" height="75" rx="10"/>
  </g>
  <g fill="#eef7fa" font-family="sans-serif" text-anchor="middle">
    <text x="105" y="62" font-size="19">Web Crypto</text>
    <text x="105" y="86" font-size="14">getRandomValues</text>
    <text x="355" y="62" font-size="19">random-js</text>
    <text x="355" y="86" font-size="14">53-bit values in [0, 1)</text>
    <text x="670" y="62" font-size="19">randomSource.next()</text>
    <text x="670" y="86" font-size="14">Gameplay, gathering, NPCs</text>
    <text x="420" y="158" font-size="17">Injected test sources preserve deterministic scenarios</text>
    <text x="420" y="196" font-size="17">Configured chances stay unchanged; streaks remain possible</text>
    <text x="420" y="222" font-size="12" fill="#a9c3d1">Architecture diagram · no gameplay capture</text>
  </g>
  <g fill="none" stroke="#68cfb2" stroke-width="3">
    <path d="M192 67h38m-9-7 9 7-9 7"/>
    <path d="M472 67h38m-9-7 9 7-9 7"/>
  </g>
</svg>
