<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480" role="img" aria-labelledby="title desc">
  <title id="title">Blank lines before control statements</title>
  <desc id="desc">Concept preview showing one blank line before for, switch and if statements after another statement. No padding is added at the start of a block.</desc>
  <rect width="700" height="480" rx="12" fill="#172b29"/>
  <g fill="#e7eeee" font-family="monospace" font-size="18" xml:space="preserve">
    <text x="24" y="36">function draw(values) {</text>
    <text x="24" y="62">  prepare();</text>
    <text x="24" y="114">  for (const value of values) {</text>
    <text x="24" y="140">    drawValue(value);</text>
    <text x="24" y="166">  }</text>
    <text x="24" y="218">  switch (values.length) {</text>
    <text x="24" y="244">    default: { break; }</text>
    <text x="24" y="270">  }</text>
    <text x="24" y="322">  if (values.length) {</text>
    <text x="24" y="348">    finish();</text>
    <text x="24" y="374">  }</text>
    <text x="24" y="400">}</text>
  </g>
  <g fill="#82cfb0" font-family="sans-serif" font-size="14">
    <text x="470" y="93">Before for</text>
    <text x="470" y="197">Before switch</text>
    <text x="470" y="301">Before if</text>
    <text x="24" y="452">Concept preview: source layout, not a gameplay capture.</text>
  </g>
</svg>
