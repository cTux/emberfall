<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-labelledby="title desc">
  <title id="title">Blank lines separate functions and results</title>
  <desc id="desc">Source layout example with blank lines before a return and between two functions. Compact guards remain on one line.</desc>
  <rect width="560" height="320" rx="12" fill="#172b29"/>
  <g fill="#e7eeee" font-family="monospace" font-size="18">
    <text x="24" y="36">function finish() {</text>
    <text x="24" y="62">  flush();</text>
    <text x="24" y="114">  return result;</text>
    <text x="24" y="140">}</text>
    <text x="24" y="192">function trim() {</text>
    <text x="24" y="218">  if (!active) return;</text>
    <text x="24" y="270">  compact();</text>
    <text x="24" y="296">}</text>
  </g>
  <g stroke="#82cfb0" stroke-width="2">
    <path d="M340 88h28m-14-7v14"/>
    <path d="M340 166h28m-14-7v14"/>
  </g>
  <g fill="#82cfb0" font-family="sans-serif" font-size="14">
    <text x="382" y="93">Before return</text>
    <text x="382" y="171">Between functions</text>
  </g>
</svg>
